name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -v
      - name: Run toy-agent gate (fast, deterministic, no LLM judge)
        run: python -m agentsentinel.cli run --agent toy-agent
