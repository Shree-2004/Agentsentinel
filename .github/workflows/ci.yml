name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -v

  gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"

      # Rolling baseline: restore the most recent DB (any prior run, via
      # prefix match) so `gate` has something real to compare against, then
      # always save this run's DB under a new unique key so the NEXT run can
      # restore it in turn. Cache keys in GitHub Actions are immutable once
      # written, so "rolling" state means "always write a new key, always
      # restore by prefix" rather than overwriting one fixed key.
      - name: Restore previous run's database
        uses: actions/cache/restore@v4
        with:
          path: agentsentinel.db
          key: agentsentinel-db-${{ github.run_id }}
          restore-keys: |
            agentsentinel-db-

      - name: Run gate (fast, deterministic scorers only — no API key needed)
        run: python -m agentsentinel.cli gate --agent toy-agent

      - name: Save this run's database for the next run's baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: agentsentinel.db
          key: agentsentinel-db-${{ github.run_id }}
